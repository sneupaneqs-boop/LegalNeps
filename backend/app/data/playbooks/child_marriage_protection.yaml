id: child_marriage_protection
area: family
keywords:
  - "बाल विवाह"
  - "child marriage"
  - "underage marriage"
  - "bal bibaha"
  - "bal biwaha"
  - "kam umer ma bibaha"
  - "kam umer ma biha"
  - "chhori ko bibaha"
  - "underage biha"
issue:
  en: "A child marriage is happening or being planned and I want to stop it or report it"
  ne: "बाल विवाह भइरहेको वा योजना बनिरहेको छ र मलाई त्यसलाई रोक्न वा उजुरी दिन छ"
fact_questions:
  - en: "How old are the people being married, and has the marriage already happened?"
    ne: "विवाह गर्ने व्यक्तिहरूको उमेर कति हो, र विवाह भइसक्यो कि हुन बाँकी छ?"
  - en: "Do you know the families involved and where they live?"
    ne: "तपाईंलाई संलग्न परिवार र तिनको ठेगाना थाहा छ?"
  - en: "Is the child in immediate danger, or is this still being planned?"
    ne: "बालबालिका तत्काल जोखिममा छ, वा यो अझै योजनामा छ?"
provisions:
  - law_title_ne: "मुलुकी अपराध संहिता, २०७४"
    section: "173"
    note:
      en: "No one may marry, or arrange the marriage of, a person who has not completed 20 years of age. A marriage in breach is void automatically, and whoever commits the offence faces up to 3 years' imprisonment and a fine of up to Rs 30,000."
      ne: "२० वर्ष उमेर नपुगी कसैले विवाह गर्न वा गराउन हुँदैन। यस विपरीतको विवाह स्वतः बदर हुन्छ, र कसूर गर्ने व्यक्तिलाई ३ वर्षसम्म कैद र ३०,००० रुपैयाँसम्म जरिबाना हुन्छ।"
  - law_title_ne: "मुलुकी अपराध संहिता, २०७४"
    section: "176"
    note:
      en: "For offences in this chapter (including child marriage), a complaint cannot be filed once three months have passed from the date you learned of the offence."
      ne: "यस परिच्छेदअन्तर्गतको कसूर (बाल विवाह समेत) मा कसूर भए गरेको कुरा थाहा पाएको मितिले तीन महिना नाघेपछि उजुर लाग्दैन।"
exclude_provisions:
  - law_title_ne: "नेपाल स्वास्थ्य सेवा नियमावली, २०५५"
    section: "116"
  - law_title_ne: "संघीय संसद सचिवालय कर्मचारी प्रशासन नियमावली, २०६५"
    section: "116"
evidence:
  - en: "Age proof of the person being married (birth certificate, citizenship application)"
    ne: "विवाह गरिने व्यक्तिको उमेरको प्रमाण (जन्म दर्ता प्रमाणपत्र, नागरिकताको निवेदन)"
  - en: "Any invitation, photos, or communication about the planned/completed marriage"
    ne: "योजना/भइसकेको विवाहबारे निम्तो, फोटो, वा सञ्चार"
  - en: "Names of people involved and organizing the marriage"
    ne: "विवाह गराउने र संलग्न व्यक्तिको नाम"
forum:
  en: "The nearest Police Office (child marriage is a criminal offence under section 173 of the Criminal Code) and the local child welfare officer under the Children Act, who can act to protect the child."
  ne: "नजिकैको प्रहरी कार्यालय (बाल विवाह अपराध संहिता दफा १७३ अनुसार फौजदारी कसूर हो) र बालबालिका सम्बन्धी ऐन अन्तर्गतका स्थानीय बालकल्याण अधिकारी, जसले बालबालिकाको संरक्षणका लागि कारबाही गर्न सक्छन्।"
limitation:
  note:
    en: "A complaint about a child marriage must be filed within three months of the date you learned of the offence (Criminal Code section 176); after that the complaint is barred. If the marriage is still only planned, report immediately so it can be stopped before it happens."
    ne: "बाल विवाहको उजुरी कसूर भएको कुरा थाहा पाएको मितिले तीन महिनाभित्र दिनुपर्छ (अपराध संहिता दफा १७६); त्यसपछि उजुर लाग्दैन। विवाह अझै योजनामा मात्र छ भने हुनुअघि रोक्न तुरुन्तै जानकारी दिनुहोस्।"
  provision:
    law_title_ne: "मुलुकी अपराध संहिता, २०७४"
    section: "176"
next_steps:
  - en: "If the marriage is imminent, contact the police or the local child welfare officer immediately to try to stop it."
    ne: "विवाह नजिकै भए रोक्न तुरुन्तै प्रहरी वा स्थानीय बालकल्याण अधिकारीलाई सम्पर्क गर्नुहोस्।"
  - en: "Gather age proof and details of who is involved."
    ne: "उमेरको प्रमाण र संलग्न व्यक्तिको विवरण जम्मा गर्नुहोस्।"
  - en: "File a complaint with the police within three months of learning of the marriage, so those responsible can be prosecuted and the marriage treated as void."
    ne: "विवाहबारे थाहा पाएको तीन महिनाभित्र प्रहरीमा उजुरी दिनुहोस्, ताकि जिम्मेवार व्यक्तिलाई कारबाही हुन सकोस् र विवाह बदर मानियोस्।"
template_link: null
