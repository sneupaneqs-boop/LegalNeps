id: overtime_working_hours
area: employment
keywords:
  - "overtime"
  - "overtime ko paisa"
  - "overtime dinna"
  - "ovartime"
  - "ओभरटाइम"
  - "अतिरिक्त समय"
  - "बढी समय काम"
  - "अतिरिक्त पारिश्रमिक"
  - "ghanta kaam"
  - "ghanta ko kaam"
