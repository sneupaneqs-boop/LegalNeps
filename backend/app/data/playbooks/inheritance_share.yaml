issue:
  en: "I want my share (अंश) of family/ancestral property"
  ne: "मलाई पारिवारिक/पैतृक सम्पत्तिमा मेरो अंश चाहिन्छ"
fact_questions:
  - en: "Has the family property ever been formally divided (अंशबण्डा) before?"
    ne: "पारिवारिक सम्पत्ति पहिले कहिल्यै औपचारिक रूपमा अंशबण्डा भएको थियो?"
  - en: "Who are the other coparceners (अंशियार), and is anyone disputing your share?"
    ne: "अरू अंशियार को-को हुन्, र कसैले तपाईंको अंश विवाद गरिरहेको छ?"
  - en: "Do you suspect any property has been hidden or concealed from the partition?"
    ne: "कुनै सम्पत्ति लुकाइएको वा छिपाइएको शंका छ?"
  - en: "If a division already happened, when did it happen, and do you disagree with it?"
    ne: "पहिले नै बण्डा भइसकेको भए, कहिले भयो, र तपाईं त्योसँग असहमत हुनुहुन्छ?"
provisions:
  - law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "205"
    note:
      en: "For dividing joint family property, the husband, wife, father, mother, sons and daughters are treated as coparceners (अंशियार)."
      ne: "सगोलको सम्पत्ति अंशबण्डा गर्ने प्रयोजनका लागि पति, पत्नी, बाबु, आमा, छोरा, छोरी अंशियार मानिन्छन्।"
  - law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "214"
    note:
      en: "A widow may take her own share and live separately at any time, whatever else the chapter says. If she marries again, the property she took as her share goes to the children of her earlier husband or, if none, to her."
      ne: "यस परिच्छेदमा अन्यत्र जुनसुकै कुरा लेखिएको भए तापनि विधवाले जहिलेसुकै आफ्नो अंश लिई भिन्न हुन सक्छिन्। विधवाले अर्को विवाह गरेमा अंश बापत पाएको सम्पत्ति अघिल्लो पतितर्फ छोरा छोरी भए तिनले र नभए आफैँले लिन पाउँछिन्।"
  - law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "216"
    note:
      en: "When joint family property is divided, the coparceners must make a written partition deed, and joint property and joint debts must be divided so that neither side is left with more or less. Shares are drawn by agreement, or by lots if they cannot agree."
      ne: "सगोलको सम्पत्ति अंशबण्डा गर्दा अंशियारहरूबीच लिखित रूपमा बण्डापत्र गर्नुपर्छ, र सगोलको सम्पत्ति र ऋण घटी बढी नहुने गरी बण्डा गर्नुपर्छ। बण्डा अंशियारको मञ्जुरीले र मञ्जुरी हुन नसके गोला हालेर गरिन्छ।"
  - law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "206"
    note:
      en: "Every coparcener is entitled to an equal share. If a female coparcener is pregnant at the time of partition and the child would be a coparcener, a share is set aside for the child; if no live child is born, other coparceners share it equally."
      ne: "प्रत्येक अंशियार अंशको समान हकदार हुन्छन्। अंशबण्डा गर्दा कुनै महिला अंशियार गर्भवती भई जन्मने शिशु अंशियार हुने भए त्यस शिशुको अंश छुट्याएर मात्र बण्डा गर्नुपर्छ; जिउँदो शिशु नजन्मे छुट्याएको अंश अन्य अंशियारले बराबर पाउँछन्।"
  - law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "222"
    note:
      en: "Once the property list is filed, the court has all the coparceners sign a statement that this is all the property and nothing is hidden, and then divides the property. If no list was filed, the court sets a deadline for the coparceners to file one."
      ne: "फाँटबारी पेश भएपछि अदालतले 'अंशबण्डा गर्नुपर्ने सम्पत्ति यत्ति हो, लुकाएको छैन' भन्ने कागज अंशियारहरूबाट गराई अंशबण्डा गरिदिन्छ। फाँटबारी पेश नभएमा अदालतले म्याद तोकी अंशियारसँग फाँटबारी माग्छ।"
  - law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "235"
    note:
      en: "Time limits for a partition suit: any time if no partition ever happened, or if a partition deed was made or the parties accounted for it and both have been enjoying their shares; 3 months from the date of partition if you disagree with a partition already made; for concealed property, during the lifetime of the coparcener who concealed it; and 6 months from the act in all other cases."
      ne: "अंश सम्बन्धी नालिसको हदम्याद: अंशबण्डा नै नभएको वा गोश्वाराको लिखत भएको र लिखत नभए पनि हिसाब गरी दुवै पक्षले भोग गरेकोमा जहिलेसुकै; अंशबण्डामा चित्त नबुझे बण्डा भएको मितिले ३ महिनाभित्र; सम्पत्ति लुकाएको वा छिपाएको सम्बन्धमा अंशियारको जीवनकालसम्म; अन्य अवस्थामा काम कारबाही भए गरेको मितिले ६ महिनाभित्र।"
  - law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "220"
    note:
      en: "A coparcener who wants to separate their share must file a suit stating the date they separated (मानो छुट्टिएको मिति) and listing the joint property and debts (फाँटबारी) as far as they know. If you cannot list the property, you must give the reason. The defendant must also file a list of property in their response. For a married daughter the separation date is her wedding day unless agreed otherwise."
      ne: "आफ्नो अंश छुट्याई भिन्न हुन चाहने अंशियारले मानो छुट्टिएको मिति उल्लेख गरी आफूले थाहा पाएसम्म बण्डा हुने सम्पत्ति र ऋणधनको फाँटबारी खुलाई नालिस गर्नुपर्छ। फाँटबारी पेश गर्न नसके कारण खुलाउनुपर्छ। विपक्षीले पनि प्रतिउत्तरसाथ आफ्नो नाममा रहेको सम्पत्तिको फाँटबारी पेश गर्नुपर्छ। विवाहिता छोरीको हकमा अन्यथा सहमति नभए मानो छुट्टिएको मिति उनको विवाह भएको दिन हुन्छ।"
  - law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "239"
    note:
      en: "If the property owner has died, the property passes to the heirs in a set order of priority: first the jointly-living spouse; then jointly-living sons, daughters and widowed daughters-in-law; then jointly-living father, mother, step-mother and grandchildren through children; then separated family members, and so on. Heirs of the same rank share equally, and a later rank inherits only if no earlier rank exists."
      ne: "सम्पत्तिका धनीको मृत्यु भएको भए अपुताली पाउने हकवालाको प्राथमिकताक्रम यस्तो छ: सगोलको पति वा पत्नी; त्यसपछि सगोलका छोरा, छोरी, विधवा बुहारी; त्यसपछि सगोलका बाबु, आमा, सौतेनी आमा र छोरा छोरीतर्फका नाति नातिनी; त्यसपछि भिन्न भएका पति पत्नी, छोरा छोरी, बाबु आमा आदि। एउटै क्रमका हकवालाले बराबर पाउँछन् र अघिल्लो क्रममा कोही भएसम्म पछिल्लो क्रमले पाउँदैन।"
  - law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "250"
    note:
      en: "For claims about the property of a person who died, a suit must be filed within the period given elsewhere in that chapter, otherwise within three years of the date the inheritance opened (the date of death)."
      ne: "मृतकको अपुतालीसम्बन्धी नालिस परिच्छेदमा अन्यत्र हदम्याद तोकिएकोमा सोही अवधिभित्र, अन्यथा अपुताली खुला भएको मितिले (मृत्यु भएको मितिले) तीन वर्षभित्र गर्नुपर्छ।"
evidence:
  - en: "Land ownership certificates (लालपुर्जा) and land revenue records"
    ne: "जग्गाको लालपुर्जा र मालपोत अभिलेख"
  - en: "Family lineage / relationship records showing you are a coparcener"
    ne: "तपाईं अंशियार भएको देखाउने वंशावली/नाता प्रमाणित कागजात"
  - en: "Any earlier partition deed (अंशबण्डाको लिखत), if one exists"
    ne: "पहिलेको अंशबण्डाको लिखत, यदि छ भने"
forum:
  en: "The District Court. A partition suit must be filed with a list of all family property and debts (फाँटबारी), so gather the property records first. Which District Court has jurisdiction is decided by the civil procedure rules; ask an advocate."
  ne: "जिल्ला अदालत। अंशबण्डाको नालिस पारिवारिक सम्पत्ति र ऋणधनको फाँटबारीसहित गर्नुपर्छ, त्यसैले पहिले सम्पत्तिका कागजात जम्मा गर्नुहोस्। कुन जिल्ला अदालतको क्षेत्राधिकार हुन्छ भन्ने देवानी कार्यविधिका नियमले तय गर्छ; वकिलसँग सोध्नुहोस्।"
limitation:
  note:
    en: "Partition (अंश) suit deadlines under section 235: no limit if there has never been a partition; 3 months from the partition date if you disagree with a partition already made; during the concealing coparcener's lifetime if property was hidden; 6 months from the act in other cases. If the claim is about property of a person who has died, a suit must be filed within 3 years of the death unless another period applies (section 250)."
    ne: "अंश नालिसको हदम्याद (दफा २३५): अंशबण्डा नै नभएको भए हदम्याद छैन; भइसकेको अंशबण्डामा चित्त नबुझे बण्डा भएको मितिले ३ महिना; सम्पत्ति लुकाएको भए लुकाउने अंशियारको जीवनकालसम्म; अन्य अवस्थामा काम कारबाही भएको मितिले ६ महिना। मृत व्यक्तिको सम्पत्तिको दाबी हो भने अन्य हदम्याद नलागेमा मृत्यु भएको मितिले ३ वर्षभित्र नालिस गर्नुपर्छ (दफा २५०)।"
  provision:
    law_title_ne: "मुलुकी देवानी संहिता, २०७४"
    section: "235"
next_steps:
  - en: "Gather documents proving your relationship to the family and the property records."
    ne: "परिवारसँगको नाता र सम्पत्तिको अभिलेख प्रमाणित गर्ने कागजात जम्मा गर्नुहोस्।"
  - en: "Try to negotiate an amicable partition (फाँटवारी तयार गरी) with other coparceners first."
    ne: "पहिले अरू अंशियारसँग फाँटवारी तयार गरी मिलेर बण्डा गर्ने प्रयास गर्नुहोस्।"
  - en: "If that fails, or if your share was denied, file a partition suit at the District Court with an advocate's help."
    ne: "असफल भएमा, वा अंश इन्कार गरिएमा, वकिलको सहयोगमा जिल्ला अदालतमा अंशबण्डाको मुद्दा दायर गर्नुहोस्।"
