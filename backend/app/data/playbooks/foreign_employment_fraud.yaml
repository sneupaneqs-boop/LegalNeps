issue:
  en: "A manpower agency cheated me about a foreign job"
  ne: "म्यानपावर एजेन्सीले वैदेशिक रोजगारीको बारेमा मलाई ठगे"
fact_questions:
  - en: "Did you pay any fee to the agency, and do you have a receipt?"
    ne: "तपाईंले एजेन्सीलाई कुनै शुल्क तिर्नुभयो, र रसिद छ?"
  - en: "What exactly went wrong — no job on arrival, different job/salary than promised, or you were never sent?"
    ne: "के भयो — गएपछि काम नभएको, वाचा गरेभन्दा फरक काम/तलब, वा पठाइएकै छैन?"
  - en: "Is the agency licensed (has a वैदेशिक रोजगार इजाजतपत्र)?"
    ne: "एजेन्सीसँग वैदेशिक रोजगार इजाजतपत्र छ?"
provisions:
  - law_title_ne: "वैदेशिक रोजगार ऐन, २०६४"
    section: "36"
    note:
      en: "If the employer or agency does not provide the employment on the terms in the contract, the worker or their representative can complain to the Department of Foreign Employment with proof; if the complaint is found reasonable the Department can order the licensed agency to pay compensation for the whole cost of going for foreign employment."
      ne: "रोजगारदाता संस्थाले सम्झौतामा तोकिएको शर्त अनुसार रोजगार उपलब्ध नगराएमा कामदार वा निजको प्रतिनिधिले प्रमाणसहित विभागमा क्षतिपूर्तिका लागि उजुरी गर्न सक्छ; व्यहोरा मनासिब देखिए विभागले इजाजतपत्रवालालाई वैदेशिक रोजगारमा जान लागेको सम्पूर्ण खर्चको क्षतिपूर्ति भराइदिने आदेश दिन सक्छ।"
  - law_title_ne: "वैदेशिक रोजगार ऐन, २०६४"
    section: "44"
    note:
      en: "A licensed agency that takes money on a false promise of a foreign job and does not send the worker abroad must return the money plus 50 percent of it, and is fined Rs 3 lakh to Rs 5 lakh, jailed for 3 to 7 years, and has its licence cancelled."
      ne: "इजाजतपत्रवालाले वैदेशिक रोजगारमा लगाइदिने भनी झुट्टो आश्वासन दिई वा प्रलोभन देखाई रकम लिई विदेश नपठाएमा लिएको रकम र सोको ५० प्रतिशत थप रकम भराइन्छ, ३ लाखदेखि ५ लाख रुपैयाँसम्म जरिबाना र ३ देखि ७ वर्षसम्म कैद हुन्छ, र इजाजतपत्र रद्द हुन्छ।"
  - law_title_ne: "वैदेशिक रोजगार ऐन, २०६४"
    section: "43"
    note:
      en: "If a person WITHOUT a licence runs a foreign employment business, or takes money by false assurance or inducement to send someone abroad, the money taken plus 50 percent is recovered, the cost of going and returning is also paid to the victim, and the offender is fined Rs 3 lakh to Rs 5 lakh and jailed for 3 to 7 years (half the punishment if the person was not actually sent abroad)."
      ne: "इजाजतपत्र नलिई वैदेशिक रोजगार व्यवसाय सञ्चालन गर्ने वा झुट्टो आश्वासन दिई वा प्रलोभन देखाई रकम लिएर विदेश पठाउने/नपठाउनेबाट लिएको रकम र सोको ५० प्रतिशत हर्जाना असुल गरी विदेश जान र आउन लागेको खर्च समेत भराइन्छ र ३ लाखदेखि ५ लाख रुपैयाँसम्म जरिबाना तथा ३ देखि ७ वर्षसम्म कैद हुन्छ (विदेश पठाइ नसकेको भए आधा सजाय)।"
  - law_title_ne: "वैदेशिक रोजगार ऐन, २०६४"
    section: "64"
    note:
      en: "Criminal cases under this Act (other than those the Department punishes itself) are heard by the Foreign Employment Tribunal; until the Tribunal is formed, the District Court does this work. Cases are brought by the government as plaintiff (section 63) after the Department's investigation (section 61)."
      ne: "यस ऐनमा विभागले सजाय गर्ने भनिएकोबाहेक अन्य मुद्दाको कारबाही र किनारा वैदेशिक रोजगार न्यायाधिकरणले गर्छ; न्यायाधिकरण गठन नभएसम्म सम्बन्धित जिल्ला अदालतले गर्छ। मुद्दा विभागको अनुसन्धान (दफा ६१) पछि सरकारवादी भई चल्छ (दफा ६३)।"
  - law_title_ne: "वैदेशिक रोजगार ऐन, २०६४"
    section: "60"
    note:
      en: "For most offences under this Act a complaint must be made within one year of the act, but a worker who went abroad can still complain within one year of the date of arriving back in Nepal."
      ne: "यस ऐन बमोजिमका अधिकांश कसूरमा सो भए गरेको मितिले एक वर्षभित्र उजुर गर्नुपर्छ, तर वैदेशिक रोजगारमा गएको कामदारले स्वदेश आइपुगेको मितिले एक वर्षभित्र उजुर दिन सक्छ।"
  - law_title_ne: "वैदेशिक रोजगार ऐन, २०६४"
    section: "55"
    note:
      en: "If a licensed agency sends a worker to a different company, for a different kind of work, or for less pay and benefits than the contract promised, the Department fines the agency Rs 1 lakh and the agency must pay the worker the shortfall in pay and benefits."
      ne: "इजाजतपत्रवालाले करार गरेको कम्पनीभन्दा अर्को कम्पनीमा, फरक प्रकृतिको काममा वा करारमा भनेभन्दा कम पारिश्रमिक र सुविधामा काम लगाएमा विभागले इजाजतपत्रवालालाई एक लाख रुपैयाँ जरिबाना गर्छ र कम दिएको पारिश्रमिक र सुविधा कामदारलाई भराइदिन्छ।"
evidence:
  - en: "Payment receipts, contract, and any promotional material from the agency"
    ne: "भुक्तानी रसिद, सम्झौता, र एजेन्सीले दिएको प्रचार सामग्री"
  - en: "The employment contract you were given (if any) and what actually happened on arrival"
    ne: "दिइएको रोजगार सम्झौता (यदि छ भने) र गएपछि वास्तवमा के भयो"
  - en: "Any communication with the agency"
    ne: "एजेन्सीसँग भएको सञ्चार"
forum:
  en: "The Department of Foreign Employment (complaint for refund or compensation, section 36; by post or electronically, or through the Chief District Officer, section 21क). For the crime of taking money on a false promise, the Department investigates and the government prosecutes; the case is heard by the Foreign Employment Tribunal (District Court until it is formed) (sections 61, 63, 64). The Department's decisions can be appealed to the government, and the Tribunal's to the Supreme Court, within 35 days (section 66)."
  ne: "वैदेशिक रोजगार विभाग (रकम फिर्ता वा क्षतिपूर्तिको उजुरी, दफा ३६; हुलाक वा विद्युतीय माध्यमबाट वा प्रमुख जिल्ला अधिकारी मार्फत, दफा २१क)। झुट्टो आश्वासन दिई रकम लिने कसूरमा विभागले अनुसन्धान गर्छ र सरकार वादी भई मुद्दा चल्छ; मुद्दा वैदेशिक रोजगार न्यायाधिकरणमा (गठन नभएसम्म जिल्ला अदालतमा) हेरिन्छ (दफा ६१, ६३, ६४)। विभागको निर्णय उपर सरकार समक्ष र न्यायाधिकरणको निर्णय उपर सर्वोच्च अदालतमा ३५ दिनभित्र पुनरावेदन गर्न सकिन्छ (दफा ६६)।"
limitation:
  note:
    en: "Complaining about a manpower agency: for most offences, the complaint must be made within 1 year of the act, or within 1 year of returning home if you went abroad (section 60). But sections 43-47, which include taking money on a false promise of a foreign job, are outside that 1-year rule. Do not rely on being late: complain to the Department as soon as you can, and check any other deadline with an advocate."
    ne: "म्यानपावर एजेन्सीविरुद्ध उजुरी: अधिकांश कसूरमा सो कार्य भएको मितिले १ वर्षभित्र, वा विदेश गएको भए स्वदेश फर्किएको मितिले १ वर्षभित्र उजुरी दिनुपर्छ (दफा ६०)। तर दफा ४३-४७ (झुट्टो आश्वासन दिई रकम लिने कसूर समेत) यो १ वर्षको हदबाट बाहिर छन्। ढिलाइमा भर नपर्नुहोस्: सकेसम्म चाँडो विभागमा उजुरी दिनुहोस् र अन्य म्यादबारे वकिलसँग सोध्नुहोस्।"
  provision:
    law_title_ne: "वैदेशिक रोजगार ऐन, २०६४"
    section: "60"
next_steps:
  - en: "Gather all receipts, contracts, and communication with the agency, and check whether the agency has a valid licence."
    ne: "सबै रसिद, करार र एजेन्सीसँगको सञ्चार जम्मा गर्नुहोस् र एजेन्सीको इजाजतपत्र वैध छ कि छैन जाँच्नुहोस्।"
  - en: "File a complaint with the Department of Foreign Employment (or the Chief District Officer) asking for a refund (money plus 50 percent, or 25 percent a year if not sent within 3 months) or compensation."
    ne: "वैदेशिक रोजगार विभाग (वा प्रमुख जिल्ला अधिकारी) मा उजुरी दिई रकम फिर्ता (रकम र ५० प्रतिशत थप, वा ३ महिनाभित्र नपठाएमा वार्षिक २५ प्रतिशत) वा क्षतिपूर्ति माग्नुहोस्।"
  - en: "If the agency took money on a false promise, ask the Department to investigate the offence so the government can prosecute it before the Foreign Employment Tribunal."
    ne: "एजेन्सीले झुट्टो आश्वासन दिई रकम लिएको भए विभागलाई कसूरको अनुसन्धान गर्न भनी सरकारले वैदेशिक रोजगार न्यायाधिकरणमा मुद्दा चलाउने व्यवस्था गर्न अनुरोध गर्नुहोस्।"
