id: fir_not_registered
area: criminal
keywords:
  - "जाहेरी दर्ता गरेन"
  - "FIR not registered"
  - "प्रहरीले उजुरी लिएन"
  - "police refused complaint"
  - "jaheri lina maandaina"
  - "jaheri lina mandaina"
  - "jaheri darkhast lidaina"
  - "jaheri darkhast lina"
