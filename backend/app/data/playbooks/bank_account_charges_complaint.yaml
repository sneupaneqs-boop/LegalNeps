  - "minimum balance"
  - "min balance"
  - "balance nabhayeko"
  - "balance nabhaeko"
  - "न्यूनतम मौज्दात"
  - "मौज्दात कम भएको"
  - "bank le paisa katyo"
  - "bank le paisa kaatyo"
  - "bank charge"
  - "bank charges"
  - "service charge"
  - "atm charge"
  - "account ma paisa katyo"
  - "khata bata paisa katyo"
  - "खाताबाट पैसा काट्यो"
  - "खाता शुल्क"
  - "बैंकले शुल्क"
  - "बैंकले पैसा काट्यो"
  - "bank gunaso"
  - "bank ko gunaso"
