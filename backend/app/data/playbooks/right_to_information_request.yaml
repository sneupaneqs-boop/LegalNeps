id: right_to_information_request
area: civil
keywords:
  - "सूचनाको हक"
  - "right to information"
  - "RTI request"
  - "सरकारी कार्यालयबाट सूचना"
issue:
  en: "I want information from a government office and don't know how to request it"
  ne: "मलाई सरकारी कार्यालयबाट सूचना चाहिन्छ तर कसरी माग्ने थाहा छैन"
fact_questions:
  - en: "What specific information do you want, and from which office?"
    ne: "तपाईंलाई ठ्याक्कै के सूचना चाहिन्छ, र कुन कार्यालयबाट?"
  - en: "Have you already asked informally, and were you refused or ignored?"
    ne: "तपाईंले पहिले नै अनौपचारिक रूपमा सोध्नुभएको थियो, र इन्कार वा बेवास्ता गरियो?"
  - en: "Is the information about yourself, or about a public matter (spending, decisions, etc.)?"
    ne: "यो सूचना तपाईं आफैंबारे हो, वा सार्वजनिक विषय (खर्च, निर्णय आदि) बारे हो?"
provisions:
  - law_title_ne: "सूचनाको हक सम्बन्धी ऐन, २०६४"
    section: "7"
    note:
      en: "A Nepali citizen who wants information applies to the Information Officer, stating the reason. The officer must give information that is readily available immediately, other information within 15 days of the application, and information about a person's life or safety within 24 hours. If the information cannot be given at once the officer must tell you the reason immediately, and if the office does not hold it the officer must say so immediately. The officer should give it in the form requested where possible."
      ne: "सूचना प्राप्त गर्न चाहने नेपाली नागरिकले कारण खुलाई सम्बन्धित सूचना अधिकारी समक्ष निवेदन दिनुपर्छ। सूचना अधिकारीले तत्काल उपलब्ध गराउन सकिने सूचना तत्काल, अन्य सूचना निवेदन प्राप्त भएको मितिले १५ दिनभित्र र जीउ ज्यानको सुरक्षासँग सम्बन्धित सूचना २४ घण्टाभित्र दिनुपर्छ। तत्काल दिन नसके कारणसहित तुरुन्त जानकारी दिनुपर्छ, र सूचना आफ्नो निकायसँग सम्बन्धित नभए सोही जानकारी तुरुन्त दिनुपर्छ। सम्भव भएसम्म माग गरेकै स्वरूपमा दिनुपर्छ।"
  - law_title_ne: "सूचनाको हक सम्बन्धी ऐन, २०६४"
    section: "9"
    note:
      en: "If the Information Officer does not give the information, refuses, gives only part of it or gives wrong information, you can complain to the head of the public body within 7 days of not receiving (or partly receiving) it. The head examines it and can order the officer to give the information and can take departmental action against an officer who acted knowingly or in bad faith."
      ne: "सूचना अधिकारीले सूचना उपलब्ध नगराएमा, अस्वीकार गरेमा, आंशिक वा गलत सूचना दिएमा वा सरोकारवाला होइन भनी नदिएमा सूचना नपाएको वा आंशिक पाएको मितिले सात दिनभित्र सार्वजनिक निकायको प्रमुख समक्ष उजूरी दिन सकिन्छ। प्रमुखले जाँचबुझ गरी सूचना दिन अधिकारीलाई आदेश दिन्छ र जानीजानी वा बदनियतले नदिएको अधिकारीलाई विभागीय कारबाही गर्न सक्छ।"
evidence:
  - en: "A copy of your written information request, if you already made one"
    ne: "पहिले नै दिनुभएको भए लिखित सूचना माग गरेको निवेदनको प्रति"
  - en: "Any written refusal or non-response from the office"
    ne: "कार्यालयबाट भएको लिखित इन्कार वा जवाफ नआएको प्रमाण"
forum:
  en: "First the public body's Information Officer (सूचना अधिकारी). If refused or ignored, complain to the head of that public body within 7 days; if you are unhappy with the head's decision, appeal to the National Information Commission (राष्ट्रिय सूचना आयोग) within 35 days."
  ne: "पहिले सम्बन्धित सार्वजनिक निकायको सूचना अधिकारी। इन्कार वा बेवास्ता गरे ७ दिनभित्र सोही निकायको प्रमुख समक्ष उजूरी दिनुहोस्; प्रमुखको निर्णयमा चित्त नबुझे ३५ दिनभित्र राष्ट्रिय सूचना आयोगमा पुनरावेदन गर्नुहोस्।"
limitation:
  note:
    en: "If the Information Officer refuses, ignores or only partly answers, you have 7 days to complain to the head of the public body (section 9). Only if you are unhappy with the head's decision can you appeal to the National Information Commission, within 35 days of being told the decision (section 10). A compensation application to the Commission must be made within 3 months (section 33)."
    ne: "सूचना अधिकारीले इन्कार, बेवास्ता वा आंशिक जवाफ दिएमा सार्वजनिक निकायको प्रमुख समक्ष ७ दिनभित्र उजूरी दिनुपर्छ (दफा ९)। प्रमुखको निर्णयमा चित्त नबुझे मात्र निर्णयको जानकारी पाएको ३५ दिनभित्र राष्ट्रिय सूचना आयोगमा पुनरावेदन गर्न सकिन्छ (दफा १०)। क्षतिपूर्तिको निवेदन आयोगमा ३ महिनाभित्र दिनुपर्छ (दफा ३३)।"
  provision:
    law_title_ne: "सूचनाको हक सम्बन्धी ऐन, २०६४"
    section: "9"
next_steps:
  - en: "Submit a clear, specific written request, stating your reason, to the office's Information Officer and pay the prescribed fee."
    ne: "कारण खुलाई स्पष्ट र विशिष्ट लिखित निवेदन कार्यालयको सूचना अधिकारीलाई दिनुहोस् र तोकिएको दस्तुर बुझाउनुहोस्।"
  - en: "Keep a copy of your request and note the date; the officer must answer within 15 days (24 hours for life or safety matters)."
    ne: "निवेदनको प्रतिलिपि र मिति राख्नुहोस्; सूचना अधिकारीले १५ दिनभित्र (जीउ ज्यानको सुरक्षामा २४ घण्टाभित्र) जवाफ दिनुपर्छ।"
  - en: "If refused, ignored or only partly answered, complain to the head of the office within 7 days; if the head also refuses, appeal to the National Information Commission within 35 days."
    ne: "इन्कार, बेवास्ता वा आंशिक जवाफ भए ७ दिनभित्र कार्यालय प्रमुख समक्ष उजूरी दिनुहोस्; प्रमुखले पनि इन्कार गरे ३५ दिनभित्र राष्ट्रिय सूचना आयोगमा पुनरावेदन गर्नुहोस्।"
template_link: null
