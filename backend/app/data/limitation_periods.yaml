# Limitation periods (हदम्याद) database.
#
# Every entry cites a section of the corpus and is checked at test time:
#   - the citation must resolve (app.playbooks.resolve_provision), and
#   - `period_phrase_ne` (copied from the section text) must appear in that section's text, and the
#     number and unit in it must equal `period.value` / `period.unit`.
# `period.kind`: fixed (a number of days/months/years), none (the text says no limitation applies),
# special (a rule that is not a plain period - see period.text).
# `needs_review: true` marks entries where the section's wording was ambiguous (e.g. the start date is not
# stated); they are still cited, but read the section before relying on them.
version: 1
general_rules:
- id: cpc_47_what_is_limitation
  citation:
    law_title_ne: मुलुकी देवानी कार्यविधि संहिता, २०७४
    section: '47'
  phrase_ne: हदम्यादको व्यवस्था भएको मानिनेछ
  text:
    en: Any fixed time a law gives for filing a plaint counts as a limitation period. You must file within it; a plaint filed outside it is not registered (and is dismissed if it slipped through).
    ne: फिरादपत्र दायर गर्न कानूनले तोकेको निश्चित समयावधि हदम्याद मानिन्छ। सोही हदम्यादभित्र फिरादपत्र दायर गर्नुपर्छ; अन्यथा दर्ता हुँदैन र दर्ता भए पनि खारेज हुन्छ।
- id: cpc_49_when_it_starts
  citation:
    law_title_ne: मुलुकी देवानी कार्यविधि संहिता, २०७४
    section: '49'
  phrase_ne: फिराद गर्नु पर्ने कारण परेको मितिले हदम्याद प्रारम्भ भएको
  text:
    en: The clock starts as the law that sets the period says. If that law says nothing about the start, it starts on the date the cause of action arose.
    ne: हदम्याद जुन कानूनमा तोकिएको छ सोही कानून बमोजिम प्रारम्भ हुन्छ; प्रारम्भ हुने कानूनी व्यवस्था नभएमा फिराद गर्नु पर्ने कारण परेको मितिले प्रारम्भ हुन्छ।
- id: cpc_55_joint_claims
  citation:
    law_title_ne: मुलुकी देवानी कार्यविधि संहिता, २०७४
    section: '55'
  phrase_ne: हदम्याद स्थगन
  text:
    en: Where several people must sue together, time is not suspended for the others just because one of them is a minor or not of sound mind; that person may sue separately later.
    ne: संयुक्त रूपमा फिराद गर्नुपर्ने व्यक्तिहरूमध्ये नाबालक वा होस ठेगानमा नरहेको व्यक्तिबाहेक अन्यको हकमा हदम्याद स्थगन हुँदैन।
- id: cpc_56_foreign_transactions
  citation:
    law_title_ne: मुलुकी देवानी कार्यविधि संहिता, २०७४
    section: '56'
  phrase_ne: नेपालभित्र नै भए गरे सरह मानी
  text:
    en: An act or transaction abroad that a Nepali court can hear is treated as if it happened in Nepal, and these limitation rules apply to it.
    ne: विदेशमा भएको काम, कारबाही वा कारोबार नेपालभित्र नै भए गरे सरह मानी यी हदम्याद सम्बन्धी व्यवस्था लागू हुन्छन्।
- id: cpc_59_proof_of_reason
  citation:
    law_title_ne: मुलुकी देवानी कार्यविधि संहिता, २०७४
    section: '59'
  phrase_ne: त्यसलाई पुष्टि गर्न आवश्यक पर्ने प्रमाण सहित अदालतमा निवेदन दिनु पर्नेछ
  text:
    en: To rely on the extensions for late filing you must apply to the court with evidence of why you could not file in time (the court may give up to 15 days to bring the evidence).
    ne: हदम्यादभित्र फिराद गर्न नसकेको कुरा पुष्टि गर्न आवश्यक प्रमाण सहित अदालतमा निवेदन दिनुपर्छ (प्रमाण पेश गर्न अदालतले १५ दिनसम्म म्याद दिन सक्छ)।
- id: cpc_60_prior_approval
  citation:
    law_title_ne: मुलुकी देवानी कार्यविधि संहिता, २०७४
    section: '60'
  phrase_ne: स्वीकृतिको सूचना प्राप्त गरेको मितिबाट
  text:
    en: If a law requires someone's approval before you sue a person, office or officer, the limitation starts from the date you were notified of the approval.
    ne: कुनै व्यक्ति, संस्था वा पदाधिकारी उपर फिराद गर्नुअघि कानून बमोजिम स्वीकृति लिनुपर्ने भए स्वीकृतिको सूचना प्राप्त गरेको मितिबाट हदम्याद प्रारम्भ हुन्छ।
- id: cpc_62_counting
  citation:
    law_title_ne: मुलुकी देवानी कार्यविधि संहिता, २०७४
    section: '62'
  phrase_ne: सक्रान्तिको हिसाबले
  text:
    en: Days are counted as calendar days starting the day after the limitation starts. Months are counted by Bikram Sambat months (sankranti), however many days each month has. A year is 12 such months.
    ne: दिन गन्तीमा तोकिएको हदम्याद हदम्याद प्रारम्भ भएको भोलिपल्टदेखि गणना गरिन्छ। महिनामा तोकिएको हदम्याद जति दिनको महिना भए पनि संक्रान्तिको हिसाबले (वि.सं. महिना अनुसार) गणना गरिन्छ। वर्षमा तोकिएको हदम्याद बाह्र महिनाको एक वर्ष मानी गणना
      गरिन्छ।
- id: cpc_90_state_the_law
  citation:
    law_title_ne: मुलुकी देवानी कार्यविधि संहिता, २०७४
    section: '90'
  phrase_ne: कुन कानून बमोजिमको हदम्यादभित्र फिराद गरेको हो सो कुरा फिरादपत्रमा खुलाउनु पर्नेछ
  text:
    en: The plaint must say which law's limitation it relies on; a plaint filed out of time is returned.
    ne: फिरादपत्रमा कुन कानून बमोजिमको हदम्यादभित्र फिराद गरेको हो सो कुरा खुलाउनुपर्छ; हदम्याद नाघेको फिरादपत्र दरपीठ गरी फिर्ता दिइन्छ।
- id: cpc_131_time_bar_defence
  citation:
    law_title_ne: मुलुकी देवानी कार्यविधि संहिता, २०७४
    section: '131'
  phrase_ne: फिरादपत्र हदम्यादभित्र दायर नभएको
  text:
    en: The defendant can plead in the reply that the plaint was not filed within the limitation.
    ne: प्रतिबादीले प्रतिउत्तरपत्रमा फिरादपत्र हदम्यादभित्र दायर नभएको जिकिर लिन सक्छ।
- id: crpc_51_1_decide_first
  citation:
    law_title_ne: मुलुकी फौजदारी कार्यविधि संहिता, २०७४
    section: '51'
  phrase_ne: हदम्याद नभएको भन्ने प्रश्न उठाएमा
  text:
    en: If the accused says the case is out of time, the court must decide that first before going further.
    ne: अभियुक्तले हदम्याद नभएको भन्ने प्रश्न उठाएमा अदालतले पहिले सो प्रश्नमा निर्णय गरेर मात्र मुद्दाको अन्य कारबाही अगाडि बढाउनुपर्छ।
- id: crpc_rules_85_counting
  citation:
    law_title_ne: मुलुकी फौजदारी कार्यविधि नियमावली, २०७५
    section: '85'
  phrase_ne: संक्रान्तिको हिसाबले
  text:
    en: 'The same counting rule applies to criminal limitation periods: calendar days from the next day; months by Bikram Sambat months; a year is 12 months.'
    ne: 'फौजदारी मुद्दाको हदम्यादमा पनि सोही गणना नियम लागू हुन्छ: दिन भोलिपल्टदेखि; महिना संक्रान्तिको हिसाबले; वर्ष बाह्र महिना।'
- id: crpc_rules_87_challenge
  citation:
    law_title_ne: मुलुकी फौजदारी कार्यविधि नियमावली, २०७५
    section: '87'
  phrase_ne: पुनरावेदन सरहको उजूर दिनु पर्ने
  text:
    en: A ruling that the case is out of time (or without jurisdiction) is challenged with a complaint like an appeal to the appellate court.
    ne: मुद्दामा अधिकारक्षेत्र वा हदम्याद नभएको भन्ने निर्णय उपरको उजूर पुनरावेदन सरहको उजूर हुन्छ।
