entries:
- id: civil_29_detained
  category: civil
  name:
    en: 'Violation of civil rights: person arrested or detained'
    ne: 'नागरिक अधिकार हनन: गिरफ्तार वा थुनिएको व्यक्ति'
  period:
    kind: none
  period_phrase_ne: जहिलेसुकै
  notes:
    en: Where the person was arrested or detained, a claim for the wrong can be filed at any time.
    ne: गिरफ्तार वा थुनिएको हकमा जहिलेसुकै नालिस गर्न सकिन्छ।
  citation:
    law_title_ne: मुलुकी देवानी संहिता, २०७४
    section: '29'
  keywords:
  - arrest
  - detention
  - civil liberties
  - गिरफ्तार
  - थुना
- id: civil_29_other
  category: civil
  name:
    en: 'Violation of civil rights: all other cases'
    ne: 'नागरिक अधिकार हनन: अन्य अवस्था'
  period:
    kind: fixed
    value: 6
    unit: months
  period_phrase_ne: छ महिनाभित्र
